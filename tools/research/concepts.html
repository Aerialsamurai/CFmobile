<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Shortcut bar concepts (mock-ups)</title>
<style>
:root { --bg:#1f1f1f; --fg:#cccccc; --gut:#6e7681; --line:#2a2d2e; --bar:#181818; --border:#2b2b2b; --accent:#3794ff;
  --kw:#569cd6; --ctl:#c586c0; --str:#ce9178; --num:#b5cea8; --type:#4ec9b0; --fn:#dcdcaa; --com:#6a9955; --pre:#c586c0; --vr:#9cdcfe; --err:#f85149; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
html, body { width: 390px; height: 844px; background: #000; overflow: hidden; font: 16px -apple-system, "Inter", system-ui, sans-serif; color: #fff; }
.phone { width: 390px; height: 844px; display: flex; flex-direction: column; background: #000; position: relative; }
.status { height: 50px; padding: 18px 28px 0 34px; display: flex; justify-content: space-between; font-weight: 600; font-size: 16px; flex: none; }
.nav { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: #0a84ff; font-size: 14px; }
.seg { display: flex; background: #1c1c1e; border-radius: 9px; padding: 2px; width: 180px; } .seg span { flex: 1; text-align: center; padding: 5px 0; border-radius: 7px; color: #fff; font-size: 13px; } .seg .on { background: #636366; font-weight: 600; }
.code { flex: 1; background: var(--bg); font: 14px/1.55 ui-monospace, Menlo, "DejaVu Sans Mono", monospace; padding: 6px 0; color: var(--fg); overflow: hidden; }
.ln { display: flex; } .ln i { width: 36px; text-align: right; padding-right: 12px; color: var(--gut); font-style: normal; flex: none; } .ln span { white-space: pre; } .ln.cur { background: var(--line); } .ln.cur i { color: #fff; }
.k { color: var(--kw) } .c { color: var(--ctl) } .t { color: var(--type) } .s { color: var(--str) } .n { color: var(--num) } .f { color: var(--fn) } .v { color: var(--vr) } .m { color: var(--com); font-style: italic } .p { color: var(--pre) }
.caret { display: inline-block; width: 2px; height: 1.15em; background: #aeafad; vertical-align: text-bottom; margin-left: 1px; }

/* shortcut bar */
.bar { background: var(--bar); border-top: 1px solid var(--border); padding: 6px 8px; display: flex; gap: 4px; flex: none; position: relative; }
.bar.two { flex-direction: column; gap: 5px; } .bar .r { display: flex; gap: 4px; }
.key { flex: 1 1 0; min-width: 0; height: 42px; border-radius: 8px; background: var(--line); color: var(--fg); display: flex; align-items: center; justify-content: center;
  font: 600 16px ui-monospace, Menlo, "DejaVu Sans Mono", monospace; position: relative; }
.key.accent { color: var(--accent); background: transparent; border: 1px solid var(--border); font-size: 14px; }
.key.ctx { background: rgba(55,148,255,.2); border: 1px solid var(--accent); color: #fff; }
.key.more { color: var(--accent); background: transparent; border: 1px solid var(--border); }
.key small { position: absolute; font: 600 8px ui-monospace, Menlo, monospace; color: #8a8f98; }
.key small.u { top: 2px; left: 50%; transform: translateX(-50%); } .key small.d { bottom: 2px; left: 50%; transform: translateX(-50%); }
.key small.l { left: 3px; top: 50%; transform: translateY(-50%); } .key small.r2 { right: 3px; top: 50%; transform: translateY(-50%); }
.key.sw { height: 46px; font-size: 17px; }
.pop { position: absolute; bottom: 352px; background: #3a3a3c; border-radius: 10px; padding: 6px 8px; display: flex; gap: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.5); z-index: 5; }
.pop .key { flex: none; width: 34px; height: 38px; background: #636366; } .pop .key.on { background: var(--accent); color: #fff; }
.tip { position: absolute; background: #0a84ff; color: #fff; font: 600 11px -apple-system, system-ui, sans-serif; padding: 4px 8px; border-radius: 8px; z-index: 6; white-space: nowrap; }

/* iOS-like dark keyboard */
.kb { height: 291px; background: #1c1c1e; padding: 8px 4px 0; flex: none; }
.kb .row { display: flex; justify-content: center; gap: 5px; margin-bottom: 11px; }
.kb .l { width: 34px; height: 44px; border-radius: 6px; background: #5a5a5e; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; box-shadow: 0 1px 0 #000; }
.kb .w { width: 44px; background: #3a3a3c; font-size: 14px; } .kb .sp { width: 174px; background: #5a5a5e; font-size: 14px; } .kb .ret { width: 84px; background: #3a3a3c; font-size: 15px; }
.kb.code .row { margin-bottom: 7px; gap: 4px; } .kb.code .l { height: 40px; }
.kb .l.sym { background: #2c2c2e; font: 600 17px ui-monospace, Menlo, monospace; color: var(--accent); }
.kb .l.dig { background: #3a3a3c; font: 500 17px ui-monospace, Menlo, monospace; }
</style></head>
<body><div class="phone" id="p"></div>
<script>
const q = new URLSearchParams(location.search).get('c') || 'speed';
const $ = (s) => document.querySelector(s);

const CODE = [
  '<span class="p">#include</span> <span class="s">&lt;bits/stdc++.h&gt;</span>',
  '<span class="k">using namespace</span> <span class="t">std</span>;',
  '',
  '<span class="t">void</span> <span class="f">solve</span>() {',
  '    <span class="t">int</span> <span class="v">n</span>;',
  '    <span class="v">cin</span> &gt;&gt; <span class="v">n</span>;',
  '    <span class="t">vector</span>&lt;<span class="t">int</span>&gt; <span class="v">a</span>(<span class="v">n</span>);',
  '    <span class="c">for</span> (<span class="t">int</span> <span class="v">i</span> = <span class="n">0</span>; <span class="v">i</span> &lt; <span class="v">n</span>; <span class="v">i</span>++)',
  '        <span class="v">cin</span><span class="caret"></span>',
  '}',
];
function codeHTML(curLine) { return CODE.map((l, i) => `<div class="ln ${i + 1 === curLine ? 'cur' : ''}"><i>${i + 1}</i><span>${l}</span></div>`).join(''); }

const status = `<div class="status"><span>9:41</span><span>5G &nbsp;▮</span></div>`;
const nav = `<div class="nav"><span>☰</span><div class="seg"><span>Problem</span><span class="on">Code</span></div><span>🔨 &nbsp;▶</span></div>`;
const kbLetters = `<div class="kb"><div class="row">${'qwertyuiop'.split('').map(c => `<div class="l">${c}</div>`).join('')}</div>
  <div class="row">${'asdfghjkl'.split('').map(c => `<div class="l">${c}</div>`).join('')}</div>
  <div class="row"><div class="l w">⇧</div>${'zxcvbnm'.split('').map(c => `<div class="l">${c}</div>`).join('')}<div class="l w">⌫</div></div>
  <div class="row"><div class="l w">123</div><div class="l w">☺</div><div class="l sp">space</div><div class="l ret">return</div></div></div>`;

const key = (g, cls = '', extra = '') => `<div class="key ${cls}">${extra}${g}</div>`;

let bar = '', kb = kbLetters, tip = '', cur = 9, pop = '';

if (q === 'speed') {
  // A: data-driven speed row, no scrolling. Order = taps saved on the iPhone keyboard (measured on 871 real solutions).
  bar = `<div class="bar">${[';', '(', ')', '&lt;', '&gt;', '=', '+', '{}', '[]', ','].map(g => key(g)).join('')}${key('⋯', 'more')}</div>`;
  pop = `<div class="pop" style="left:228px"><div class="key">{</div><div class="key on">{}</div><div class="key">}</div></div>`;
  tip = `<div class="tip" style="left:110px;bottom:404px">hold a key for variants</div>`;
} else if (q === 'swipe') {
  // B: Textastic-style swipe keys: tap = main symbol, swipe = alternates printed on the key
  const sw = (m, u, d, l, r) => key(m, 'sw', `${u ? `<small class="u">${u}</small>` : ''}${d ? `<small class="d">${d}</small>` : ''}${l ? `<small class="l">${l}</small>` : ''}${r ? `<small class="r2">${r}</small>` : ''}`);
  bar = `<div class="bar">${[sw(';', ':', '?'), sw('(', ')', '()'), sw('{', '}', '{}'), sw('[', ']', '[]'), sw('&lt;', '&gt;', '', '&lt;&lt;', '&gt;&gt;'), sw('=', '==', '!=', '&lt;=', '&gt;='), sw('+', '-', '*', '++', '+='), sw(',', '.', '_'), sw('"', "'", '#')].join('')}</div>`;
  tip = `<div class="tip" style="left:60px;bottom:358px">tap = main symbol · swipe = the small symbols</div>`;
} else if (q === 'smart') {
  // C: context row: the first slots change with what you just typed (symbols/operators only, no word suggestions)
  bar = `<div class="bar">${[key('&gt;&gt;', 'ctx'), key(';', 'ctx'), key('(', ''), key(')', ''), key('{}'), key('[]'), key('&lt;'), key('&gt;'), key('='), key('+'), key('⋯', 'more')].join('')}</div>`;
  tip = `<div class="tip" style="left:10px;bottom:353px">you typed “cin” → &gt;&gt; first</div>`;
} else if (q === 'grid') {
  // D: always-visible two-row grid, nothing to open
  bar = `<div class="bar two"><div class="r">${[';', '(', ')', '{', '}', '[', ']', ','].map(g => key(g)).join('')}</div><div class="r">${['&lt;', '&gt;', '&lt;&lt;', '&gt;&gt;', '=', '==', '+', '.'].map(g => key(g)).join('')}</div></div>`;
  cur = 9;
} else if (q === 'keyboard') {
  // E: replace the iOS keyboard with a code-first keyboard (symbols + digits always visible)
  bar = '';
  const r = (arr, cls) => `<div class="row">${arr.map(c => `<div class="l ${cls || ''} ${c === '⇧' || c === '⌫' ? 'w' : ''}">${c}</div>`).join('')}</div>`;
  kb = `<div class="kb code">${r([';', '(', ')', '{', '}', '[', ']', '&lt;', '&gt;', '='], 'sym')}${r(['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'], 'dig')}${r('qwertyuiop'.split(''))}${r('asdfghjkl'.split(''))}${r(['⇧', ...'zxcvbnm'.split(''), '⌫'])}
    <div class="row"><div class="l w sym">+ -</div><div class="l w sym">, .</div><div class="l sp">space</div><div class="l w">⇥</div><div class="l ret" style="width:70px">return</div></div></div>`;
} else if (q === 'current') {
  // F: what you have now: a home row with category buttons
  bar = `<div class="bar">${[';', '{}', '()', '&lt;&lt;'].map(g => key(g)).join('')}${['[ &lt;', '+ =', '&amp; ?', 'I/O', 'for', '✎'].map(g => key(g, 'accent')).join('')}</div>`;
}

$('#p').innerHTML = `${status}${nav}<div class="code">${codeHTML(cur)}</div>${bar}${kb}${pop}${tip}`;
</script></body></html>
