name: Build iOS app (unsigned IPA)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web part (editor + compiler)
        working-directory: Web
        run: |
          npm install
          node build.mjs
          rm -rf ../CFPhone/web
          cp -R dist ../CFPhone/web

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild -project CFPhone.xcodeproj -scheme CFPhone -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build | tee build.log | tail -n 60

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CFPhone.app Payload/
          zip -qry CFPhone.ipa Payload
          ls -lh CFPhone.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CFPhone-ipa
          path: CFPhone.ipa

      # A public, always-current download: https://github.com/<owner>/<repo>/releases/latest/download/CFPhone.ipa
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CFPhone.ipa \
            --title "CF Phone — latest build" \
            --target "$GITHUB_SHA" \
            --notes "Unsigned iOS app, built from commit $SHORT on $(date -u +'%Y-%m-%d %H:%M UTC').

          **How to install:** see the [README](https://github.com/$GITHUB_REPOSITORY#install-on-your-iphone). The file is unsigned on purpose: Sideloadly or AltStore signs it with your own free Apple ID."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
