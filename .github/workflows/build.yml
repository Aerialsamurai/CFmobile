name: Build iOS app (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web part (editor + compiler)
        working-directory: Web
        run: |
          npm install
          node build.mjs
          rm -rf ../CFPhone/web
          cp -R dist ../CFPhone/web

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild -project CFPhone.xcodeproj -scheme CFPhone -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build | tee build.log | tail -n 60

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CFPhone.app Payload/
          zip -qry CFPhone.ipa Payload
          ls -lh CFPhone.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CFPhone-ipa
          path: CFPhone.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
