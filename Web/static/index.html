<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:root { --fs: 14px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; -webkit-text-size-adjust: 100%; }
#editor { position: fixed; inset: 0; }
.cm-editor { font-size: var(--fs); }
.cm-editor.cm-focused { outline: none; }
.cf-line-error { background: var(--errbg); box-shadow: inset 3px 0 0 var(--err); }
.cf-line-warning { background: var(--warnbg); box-shadow: inset 3px 0 0 var(--warn); }
.cf-dot { font-size: 9px; line-height: 1; vertical-align: middle; }
.cf-dot.cf-error { color: var(--err); } .cf-dot.cf-warning { color: var(--warn); }
.cf-label { margin-left: 1.4em; padding: 1px 7px; border-radius: 4px; font: 500 .78em/1.4 -apple-system, system-ui, sans-serif; white-space: nowrap; }
.cf-label.cf-error { color: var(--err); background: var(--errbg); }
.cf-label.cf-warning { color: var(--warn); background: var(--warnbg); }
@media (max-width: 600px) { .cf-label { display: none; } }
#errbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--bar); border-top: 1px solid var(--border);
  font: 14px/1.35 -apple-system, system-ui, sans-serif; color: var(--fg); transform: translateY(120%); transition: transform .18s ease; z-index: 5; }
#errbar.show { transform: none; }
#errbar .row { display: flex; gap: 10px; padding: 5px 0; }
#errbar .row b { flex: none; font-weight: 600; min-width: 56px; }
#errbar .row.error b { color: var(--err); } #errbar .row.warning b { color: var(--warn); }
#keys { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 4px; padding: 6px 8px; background: var(--bar); border-top: 1px solid var(--border);
  opacity: 0; pointer-events: none; transition: opacity .12s; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
#keys.up { opacity: 1; pointer-events: auto; }
#keys button { flex: 1 1 0; min-width: 0; height: 42px; border: 0; border-radius: 8px; background: var(--line); color: var(--fg);
  font: 600 16px ui-monospace, Menlo, monospace; padding: 0 2px; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
#keys button.down { background: var(--sel); transform: scale(.96); }
#keys.home button.more { background: transparent; border: 1px solid var(--border); color: var(--accent); font-size: 18px; }
#keys.home { gap: 3px; }
#keys.home button { font-size: 17px; }
#keys.home button.hasv::after { content: ''; position: absolute; }
#keys button { position: relative; }
#keys.page button.cat { color: var(--accent); border: 1px solid var(--border); background: transparent; font-size: 14px; }
.kpop { position: fixed; z-index: 30; display: flex; gap: 4px; padding: 6px; background: #3a3a3c; border-radius: 12px; box-shadow: 0 8px 22px rgba(0,0,0,.55); }
.kpop div { min-width: 36px; height: 42px; padding: 0 6px; border-radius: 8px; background: #636366; color: #fff; display: flex; align-items: center; justify-content: center; font: 600 17px ui-monospace, Menlo, monospace; white-space: nowrap; }
.kpop div.on { background: var(--accent); }
#keys.page { flex-wrap: wrap; gap: 6px; }
#keys.page button { flex: 0 0 calc((100% - 42px) / 8); }
#keys.page button.long { flex: 0 0 auto; min-width: 56px; padding: 0 12px; font-size: 14px; color: var(--fn); }
#keys.page button.back { color: var(--accent); font-size: 22px; font-weight: 700; }
</style></head>
<body>
<div id="editor"></div>
<div id="errbar"></div>
<div id="keys"></div>
<script type="module" src="app.js"></script>
</body></html>
